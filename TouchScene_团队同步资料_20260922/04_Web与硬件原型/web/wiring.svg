<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TouchPuck ESP32-C3、振动马达和 SW-420 接线图</title>
  <desc id="desc">GPIO4 通过一百欧电阻控制 AO3400 MOSFET，五伏电源驱动振动马达，SS14 反向并联保护，SW-420 的数字输出连接 GPIO5，所有设备共地。</desc>
  <defs>
    <style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#eaf4f7}.title{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#9fc1cb}.box{fill:#14252f;stroke:#6d8b95;stroke-width:2}.pin{fill:#203945;stroke:#6d8b95}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#ff725e}.cyan{stroke:#61c6df}.green{stroke:#55d6a2}.orange{stroke:#ffc857}.ground{stroke:#a7bbc2}.note{fill:#20313a;stroke:#38515d}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#0d1820"/><text x="48" y="48" class="title">TouchPuck · 最小物理闭环接线</text>
  <rect x="48" y="82" width="270" height="500" rx="22" class="box"/><text x="76" y="124" class="h">ESP32-C3 SuperMini</text><text x="76" y="151" class="s">USB-C 负责烧录与板载供电</text>
  <rect x="238" y="178" width="80" height="44" rx="8" class="pin"/><text x="254" y="206" class="t">3V3</text><rect x="238" y="248" width="80" height="44" rx="8" class="pin"/><text x="249" y="276" class="t">GPIO5</text><rect x="238" y="362" width="80" height="44" rx="8" class="pin"/><text x="249" y="390" class="t">GPIO4</text><rect x="238" y="500" width="80" height="44" rx="8" class="pin"/><text x="258" y="528" class="t">GND</text>
  <rect x="390" y="92" width="230" height="220" rx="20" class="box"/><text x="418" y="132" class="h">SW-420</text><text x="418" y="158" class="s">紧贴马达外壳 · 灵敏度可调</text><rect x="390" y="178" width="74" height="40" rx="7" class="pin"/><text x="407" y="204" class="t">VCC</text><rect x="390" y="248" width="74" height="40" rx="7" class="pin"/><text x="413" y="274" class="t">DO</text><rect x="526" y="248" width="74" height="40" rx="7" class="pin"/><text x="542" y="274" class="t">GND</text>
  <path d="M318 200 H390" class="wire green" marker-end="url(#arrow)"/><text x="330" y="188" class="s">3.3 V</text><path d="M318 270 H390" class="wire cyan" marker-end="url(#arrow)"/><text x="327" y="258" class="s">传感反馈</text>
  <rect x="418" y="350" width="122" height="66" rx="13" class="note"/><text x="442" y="379" class="t">100 Ω</text><text x="435" y="400" class="s">栅极限流</text><path d="M318 384 H418" class="wire orange"/><path d="M540 384 H684 V466" class="wire orange" marker-end="url(#arrow)"/>
  <path d="M594 466 V555" class="wire ground"/><rect x="548" y="480" width="92" height="54" rx="10" class="note"/><text x="568" y="504" class="t">10 kΩ</text><text x="567" y="524" class="s">下拉</text>
  <rect x="650" y="432" width="190" height="142" rx="20" class="box"/><text x="683" y="466" class="h">AO3400</text><text x="680" y="490" class="s">逻辑电平 N-MOS</text><text x="659" y="528" class="s">G</text><text x="758" y="438" class="s">D</text><text x="758" y="570" class="s">S</text>
  <rect x="740" y="176" width="210" height="138" rx="20" class="box"/><text x="784" y="216" class="h">5 V 振动马达</text><circle cx="818" cy="262" r="28" fill="none" stroke="#ff725e" stroke-width="6"/><path d="M802 262 H834 M818 246 V278" class="wire red"/><text x="858" y="268" class="t">ERM</text><path d="M770 314 V432" class="wire red" marker-end="url(#arrow)"/><text x="782" y="360" class="s">马达 − → Drain</text>
  <rect x="970" y="84" width="184" height="154" rx="20" class="box"/><text x="1001" y="124" class="h">5 V / 2 A</text><text x="1005" y="149" class="s">独立稳压电源</text><rect x="970" y="170" width="64" height="40" rx="7" class="pin"/><text x="983" y="196" class="t">+5V</text><rect x="1070" y="170" width="64" height="40" rx="7" class="pin"/><text x="1082" y="196" class="t">GND</text><path d="M970 190 H920 V176 H818" class="wire red" marker-end="url(#arrow)"/><text x="884" y="163" class="s">马达 +</text>
  <rect x="970" y="272" width="184" height="118" rx="18" class="note"/><text x="1016" y="309" class="h">SS14</text><text x="988" y="336" class="t">反向并联马达</text><text x="988" y="362" class="s">阴极接 +5V · 阳极接 Drain</text><path d="M970 330 H932 V222" class="wire red"/><path d="M1154 330 H1170 V424 H770" class="wire red"/>
  <path d="M90 620 H1120" class="wire ground"/><path d="M278 544 V620 M563 288 V620 M745 574 V620 M1102 210 V620" class="wire ground"/><text x="92" y="651" class="h">共地是必须条件</text><text x="270" y="651" class="t">ESP32 GND、SW-420 GND、MOSFET Source、5 V 电源 GND 全部相连</text>
  <rect x="48" y="674" width="1106" height="30" rx="10" fill="#381f22"/><text x="72" y="695" class="t">禁止：马达直接接 GPIO。先断电接线，确认 SS14 极性后再接入 5 V。</text>
</svg>
